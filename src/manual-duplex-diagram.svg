<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-labelledby="title desc">
  <title id="title">Manual duplex: collect and reload the paper stack</title>
  <desc id="desc">Two separate areas show the output tray and input tray. A straight arrow points from output to input. Reload the stack using the loading direction verified for your printer.</desc>
  <rect x="1" y="1" width="498" height="278" rx="16" fill="#f5f7fb" stroke="#8b9bb1" stroke-width="2"/>

  <g data-area="output">
    <rect data-role="panel" x="14" y="16" width="202" height="248" rx="12" fill="#ffffff" stroke="#526b8e" stroke-width="2"/>
    <text data-role="area-label" x="115" y="48" text-anchor="middle" fill="#172033" font-family="system-ui, sans-serif" font-size="17" font-weight="750">OUTPUT TRAY</text>
    <text data-role="label" x="115" y="77" text-anchor="middle" fill="#172033" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Collect printed sheets</text>
    <text data-role="label" x="115" y="97" text-anchor="middle" fill="#172033" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Keep sheets in order</text>

    <g data-role="illustration" data-bounds="40 122 150 86">
      <path d="M40 176H190L174 208H55Z" fill="#dce8f8" stroke="#315b91" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M48 181H183" fill="none" stroke="#315b91" stroke-width="2"/>
      <path d="M80 134H166V185H80Z" fill="#d8e6f7" stroke="#315b91" stroke-width="2" stroke-linejoin="round"/>
      <path d="M72 128H158V179H72Z" fill="#edf3fc" stroke="#315b91" stroke-width="2" stroke-linejoin="round"/>
      <path d="M64 122H150V173H64Z" fill="#ffffff" stroke="#315b91" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>

  <path data-role="flow-arrow" d="M226 158H265" fill="none" stroke="#2458a6" stroke-width="5" stroke-linecap="round"/>
  <path data-role="flow-arrowhead" d="M262 149L278 158L262 167Z" fill="#2458a6"/>

  <g data-area="input">
    <rect data-role="panel" x="284" y="16" width="202" height="248" rx="12" fill="#ffffff" stroke="#526b8e" stroke-width="2"/>
    <text data-role="area-label" x="385" y="48" text-anchor="middle" fill="#172033" font-family="system-ui, sans-serif" font-size="17" font-weight="750">INPUT TRAY</text>
    <text data-role="label" x="385" y="77" text-anchor="middle" fill="#172033" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Reload the stack using</text>
    <text data-role="label" x="385" y="97" text-anchor="middle" fill="#172033" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">your printer's verified</text>
    <text data-role="label" x="385" y="117" text-anchor="middle" fill="#172033" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">loading direction</text>

    <g data-role="illustration" data-bounds="290 137 188 82">
      <path d="M300 188H468L478 219H290Z" fill="#dcefe6" stroke="#267254" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M307 193H468" fill="none" stroke="#267254" stroke-width="2"/>
      <path d="M344 149H430V197H344Z" fill="#cfe8dc" stroke="#267254" stroke-width="2" stroke-linejoin="round"/>
      <path d="M336 143H422V191H336Z" fill="#e9f5ef" stroke="#267254" stroke-width="2" stroke-linejoin="round"/>
      <path d="M328 137H414V185H328Z" fill="#ffffff" stroke="#267254" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
