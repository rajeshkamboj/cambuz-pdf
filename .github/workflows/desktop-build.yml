name: Desktop builds

# Packages the Electron desktop app, runs packaged smoke tests, and on every
# successful push to `main` publishes a pinned GitHub pre-release containing all
# five platform installers, updates the marked download sections in README.md,
# and notifies rajeshkamboj/cambuz-landing. Code-signing is optional: if a signing
# service is unavailable or signing credentials are absent, tested unsigned builds
# are still published with clear warnings. Pull requests never publish releases.

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never search the runner for a code-signing identity; signing is only used
  # when explicitly configured with the repository's signing credentials.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  test:
    name: Regression tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Tests stub the `electron` module, so no Electron binary is needed: the
    # package no longer downloads one at install time (Electron 42+ fetches it
    # on first run instead), and electron-builder fetches its own copy.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate landing-site feature manifest
        run: node scripts/validate-landing-content.mjs
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/test-icon-assets.py

  windows-x64:
    name: Windows x64 (installer + portable)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90   # allow a SignPath timeout to fall back to unsigned outputs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (downloads the Windows Electron runtime)
        run: npm ci
      # electron-builder builds the Windows installers first. SignPath signing
      # is optional; missing credentials or a rejected/failed signing request
      # leaves these tested executables unsigned, and unsigned releases are allowed.
      - name: Build NSIS installer and portable executable
        run: npm run build:win
      - name: Verify packaged contents
        run: node scripts/check-packaged-app.mjs dist/win-unpacked/resources/app.asar
      - name: Verify runtime license files ship next to the executable
        shell: pwsh
        run: |
          Get-ChildItem dist/win-unpacked -File | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          $licenses = @((Get-ChildItem dist/win-unpacked -File | Where-Object { $_.Name -like 'LICENSE*' }))
          if ($licenses.Count -eq 0) { throw 'No Electron LICENSE files in win-unpacked; third-party runtime notices would not ship' }
          Write-Host "LICENSE files: $($licenses.Name -join ', ')"
      - name: Prepare OS file-open probe PDFs
        run: node -e "const fs=require('fs');const path=require('path');const dir=path.join(process.env.RUNNER_TEMP,'cambuz-launch');fs.mkdirSync(dir,{recursive:true});const target=path.join(dir,'fichier-été.pdf');fs.copyFileSync('samples/hindi-sample.pdf',target);console.log(target)"

      # ── Optional SignPath Foundation signing (free for open-source) ──
      - name: Check if SignPath signing is configured
        id: signpath-check
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        shell: bash
        run: |
          if [[ -n "$SIGNPATH_API_TOKEN" && -n "$SIGNPATH_ORGANIZATION_ID" && \
                -n "$SIGNPATH_PROJECT_SLUG" && -n "$SIGNPATH_SIGNING_POLICY_SLUG" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SignPath settings found — will try optional Windows signing."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SignPath is not fully configured. Windows executables will remain unsigned; release publication is not blocked."
          fi

      - name: Stage unsigned executables for SignPath
        id: stage-signpath
        if: steps.signpath-check.outputs.configured == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'signpath-unsigned'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Get-ChildItem dist -File | Where-Object {
            $_.Name -like '*-setup.exe' -or $_.Name -like '*-portable.exe'
          } | ForEach-Object {
            Copy-Item $_.FullName $staging
            Write-Host "  staged: $($_.Name)"
          }

      - name: Upload unsigned executables for SignPath
        id: upload-unsigned
        if: steps.signpath-check.outputs.configured == 'true' && steps.stage-signpath.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-exes
          path: ${{ runner.temp }}/signpath-unsigned/*
          if-no-files-found: error
          retention-days: 1

      - name: Submit to SignPath Foundation for signing
        id: submit-signing
        if: steps.signpath-check.outputs.configured == 'true' && steps.upload-unsigned.outcome == 'success'
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-signed
          wait-for-completion-timeout-in-seconds: 3600

      - name: Replace unsigned files with signed versions
        if: steps.submit-signing.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $signedDir = Join-Path $env:RUNNER_TEMP 'signpath-signed'
          if (-not (Test-Path $signedDir)) {
            Write-Warning 'SignPath completed without an output directory; keeping unsigned executables.'
            exit 0
          }
          $signedFiles = @(Get-ChildItem $signedDir -File -ErrorAction SilentlyContinue)
          if ($signedFiles.Count -eq 0) {
            Write-Warning 'SignPath returned no files; keeping unsigned executables.'
            exit 0
          }
          foreach ($file in $signedFiles) {
            $dest = Join-Path dist $file.Name
            Copy-Item $file.FullName $dest -Force
            Write-Host "✓ Replaced $($file.Name) with SignPath-signed version"
          }

      - name: Keep unsigned Windows files when SignPath is unavailable
        if: steps.signpath-check.outputs.configured == 'true' && steps.submit-signing.outcome != 'success'
        run: echo "::warning::Optional SignPath signing did not complete. Keeping unsigned Windows executables; an unsigned release can still be published."
      # ── end optional SignPath ───────────────────────────────────────

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like '*-setup.exe' -or $_.Name -like '*-portable.exe' }
          $sums = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLower()
            $mib = [math]::Round($file.Length / 1MB, 1)
            Write-Host "::notice title=Build output::$($file.Name) - $mib MiB - SHA-256 $hash"
            "$hash  $($file.Name)"
          }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          $malformed = Get-Content dist/SHA256SUMS.txt | Where-Object { $_ -notmatch '^[0-9a-f]{64}  \S' }
          if ($malformed) { throw "Malformed SHA256SUMS.txt lines: $($malformed -join '; ')" }
          $appAsar = Get-Item dist/win-unpacked/resources/app.asar
          Write-Host "::notice title=Build output::app.asar (renderer payload) - $([math]::Round($appAsar.Length / 1MB, 1)) MiB"
      - name: Verify code-signature status
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem dist -File | Where-Object {
            $_.Name -like '*-setup.exe' -or $_.Name -like '*-portable.exe'
          }
          $allSigned = $true
          foreach ($file in $exeFiles) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -eq 'Valid') {
              Write-Host "  ✓ $($file.Name): signed by $($sig.SignerCertificate.Subject)"
            } else {
              $allSigned = $false
              Write-Host "  ✗ $($file.Name): NOT signed (Status: $($sig.Status))"
            }
          }
          if ($allSigned) {
            "signed" | Set-Content -Encoding ascii dist/SIGNED.txt
            Write-Host "::notice title=Code signing::All Windows executables are code-signed."
          } else {
            "unsigned" | Set-Content -Encoding ascii dist/SIGNED.txt
            Write-Host "::warning title=Code signing::Windows executables are NOT signed."
          }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cambuz-pdf-windows-x64
          path: |
            dist/*-setup.exe
            dist/*-portable.exe
            dist/SHA256SUMS.txt
            dist/SIGNED.txt
          if-no-files-found: error
          retention-days: 30
      - name: Smoke test the unpacked build
        shell: pwsh
        run: |
          $launchPdf = Join-Path $env:RUNNER_TEMP 'cambuz-launch\fichier-été.pdf'
          $secondPdf = Join-Path $env:GITHUB_WORKSPACE 'samples\punjabi-sample.pdf'
          node scripts/smoke-test-packaged.mjs --app "dist/win-unpacked/Cambuz PDF Reader.exe" --out smoke/win-unpacked --port 9331 --timeout 180 --launch-pdf $launchPdf --second-pdf $secondPdf
      - name: Install silently, smoke test the installed app, uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*-setup.exe' -File | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'cambuz-pdf-install'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }
          $exe = Join-Path $target 'Cambuz PDF Reader.exe'
          if (-not (Test-Path $exe)) { throw "Installed executable not found: $exe" }
          # Application name, publisher and version stamped on the executable.
          $versionInfo = (Get-Item $exe).VersionInfo
          Write-Host "ProductName=$($versionInfo.ProductName) FileVersion=$($versionInfo.FileVersion) CompanyName=$($versionInfo.CompanyName) LegalCopyright=$($versionInfo.LegalCopyright)"
          if ($versionInfo.ProductName -ne 'Cambuz PDF Reader') { throw "Unexpected ProductName: $($versionInfo.ProductName)" }
          $expectedVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($versionInfo.FileVersion -notlike "$expectedVersion*") { throw "Unexpected FileVersion: $($versionInfo.FileVersion) (package.json has $expectedVersion)" }
          if ([string]::IsNullOrWhiteSpace($versionInfo.CompanyName)) { throw 'CompanyName (publisher) is empty on the installed executable' }
          # Start Menu shortcut (per-user install) and .pdf file association.
          $startMenuLink = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Cambuz PDF Reader.lnk'
          if (-not (Test-Path $startMenuLink)) { throw "Start Menu shortcut not found: $startMenuLink" }
          $pdfProgId = $null
          if (Test-Path 'HKCU:\Software\Classes\.pdf') { $pdfProgId = (Get-ItemProperty 'HKCU:\Software\Classes\.pdf' -ErrorAction Stop).'(default)' }
          if ($pdfProgId -ne 'CambuzPDFReader.Document') { throw "Expected .pdf ProgId 'CambuzPDFReader.Document', got '$pdfProgId'" }
          $openCommand = (Get-ItemProperty 'HKCU:\Software\Classes\CambuzPDFReader.Document\shell\open\command' -ErrorAction Stop).'(default)'
          if ($openCommand -notlike '*Cambuz PDF Reader.exe*') { throw "Unexpected .pdf open command: $openCommand" }
          Write-Host ".pdf association registered: $pdfProgId -> $openCommand"
          $launchPdf = Join-Path $env:RUNNER_TEMP 'cambuz-launch\fichier-été.pdf'
          $secondPdf = Join-Path $env:GITHUB_WORKSPACE 'samples\punjabi-sample.pdf'
          node scripts/smoke-test-packaged.mjs --app $exe --out smoke/installed --port 9332 --timeout 180 --launch-pdf $launchPdf --second-pdf $secondPdf
          $smokeExit = $LASTEXITCODE
          $uninstaller = Join-Path $target 'Uninstall Cambuz PDF Reader.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/S') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'Installed application still present after uninstall' }
          if (Test-Path $startMenuLink) { throw 'Start Menu shortcut still present after uninstall' }
          if (Test-Path 'HKCU:\Software\Classes\CambuzPDFReader.Document') { throw 'File association still present after uninstall' }
          if ($smokeExit -ne 0) { throw "Smoke test failed for the installed application (exit $smokeExit)" }
      - name: Smoke test the portable executable
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist -Filter '*-portable.exe' -File | Select-Object -First 1
          $launchPdf = Join-Path $env:RUNNER_TEMP 'cambuz-launch\fichier-été.pdf'
          $secondPdf = Join-Path $env:GITHUB_WORKSPACE 'samples\punjabi-sample.pdf'
          node scripts/smoke-test-packaged.mjs --app $portable.FullName --out smoke/portable --port 9333 --timeout 180 --launch-pdf $launchPdf --second-pdf $secondPdf
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-evidence-windows-x64
          path: smoke/
          if-no-files-found: ignore
          retention-days: 14

  linux-x64:
    name: Linux x64 (AppImage) — experimental
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build AppImage
        run: npm run build:linux
      - name: Verify packaged contents
        run: node scripts/check-packaged-app.mjs dist/linux-unpacked/resources/app.asar
      - name: Write SHA-256 checksums
        run: |
          cd dist
          sha256sum *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
          for f in *.AppImage; do
            echo "::notice title=Build output::$f — $(awk -v b=$(stat -c %s "$f") 'BEGIN{printf "%.1f MiB", b/1048576}') — $(sha256sum "$f" | cut -d' ' -f1)"
          done
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cambuz-pdf-linux-x64
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Verify desktop entry, icons and mime wiring inside the AppImage
        run: |
          cd dist
          appimage=$(ls *.AppImage | head -n 1)
          ./"$appimage" --appimage-extract 'cambuz-pdf-reader.desktop' >/dev/null
          ./"$appimage" --appimage-extract 'usr/share/icons/hicolor/*/apps/cambuz-pdf-reader.png' >/dev/null
          ./"$appimage" --appimage-extract 'usr/share/mime/packages/cambuz-pdf-reader.xml' >/dev/null
          grep -H '^Icon=cambuz-pdf-reader$' squashfs-root/cambuz-pdf-reader.desktop
          grep -H 'MimeType=.*application/pdf' squashfs-root/cambuz-pdf-reader.desktop
          test -n "$(find squashfs-root/usr/share/icons -name 'cambuz-pdf-reader.png' | head -n 1)"
          grep -H 'mime-type type="application/pdf"' squashfs-root/usr/share/mime/packages/cambuz-pdf-reader.xml
          grep -H 'glob pattern="\*.pdf"' squashfs-root/usr/share/mime/packages/cambuz-pdf-reader.xml
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Prepare OS file-open probe PDFs
        run: node -e "const fs=require('fs');const path=require('path');const dir=path.join(process.env.RUNNER_TEMP,'cambuz-launch');fs.mkdirSync(dir,{recursive:true});const target=path.join(dir,'fichier-été.pdf');fs.copyFileSync('samples/hindi-sample.pdf',target);console.log(target)"
      - name: Smoke test the unpacked build under Xvfb
        run: xvfb-run -a node scripts/smoke-test-packaged.mjs --app dist/linux-unpacked/cambuz-pdf-reader --arg --no-sandbox --out smoke/linux --port 9335 --timeout 180 --launch-pdf "$RUNNER_TEMP/cambuz-launch/fichier-été.pdf" --second-pdf "$GITHUB_WORKSPACE/samples/punjabi-sample.pdf"
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-evidence-linux-x64
          path: smoke/
          if-no-files-found: ignore
          retention-days: 14

  macos-arm64:
    name: macOS arm64 (DMG + ZIP) — experimental
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build DMG and ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # electron-builder passes these to notarytool for Apple notarization.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac
      - name: Verify packaged contents
        run: node scripts/check-packaged-app.mjs "dist/mac-arm64/Cambuz PDF Reader.app/Contents/Resources/app.asar"
      - name: Verify document types and icon wiring (build only, app not launched)
        run: |
          APP="dist/mac-arm64/Cambuz PDF Reader.app"
          test -f "$APP/Contents/Resources/icon.icns"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes:0:CFBundleTypeExtensions" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes:0:CFBundleTypeRole" "$APP/Contents/Info.plist" | grep -q Viewer
      - name: Verify code-signature and notarization status
        run: |
          APP="dist/mac-arm64/Cambuz PDF Reader.app"
          if codesign --verify --deep --strict "$APP" 2>/dev/null; then
            echo "  ✓ App bundle is code-signed"
            codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true
            # Check notarization stapling on DMG and ZIP
            for f in dist/*.dmg dist/*.zip; do
              if xcrun stapler validate "$f" 2>/dev/null; then
                echo "  ✓ $(basename "$f") is notarized and stapled"
              else
                echo "  ℹ $(basename "$f") — stapler check inconclusive (may still be notarized via online ticket)"
              fi
            done
            echo "signed" > dist/SIGNED.txt
            echo "::notice title=Code signing::macOS builds are code-signed and notarized."
          else
            echo "  ✗ App bundle is NOT code-signed"
            echo "unsigned" > dist/SIGNED.txt
            echo "::warning title=Code signing::macOS builds are NOT signed. Set MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID repository secrets."
          fi
      - name: Write SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          for f in *.dmg *.zip; do
            echo "::notice title=Build output::$f — $(awk -v b=$(stat -f %z "$f") 'BEGIN{printf "%.1f MiB", b/1048576}') — $(shasum -a 256 "$f" | cut -d' ' -f1)"
          done
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cambuz-pdf-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/SIGNED.txt
          if-no-files-found: error
          retention-days: 30

  # Publishes a complete five-binary GitHub Release when `main` or a manual `v*`
  # tag is pushed and all platform build jobs succeeded. Automatic `main` builds
  # create/update a pinned pre-release (`v<version>-build.<run_number>`), sync
  # the marked sections of README.md, and notify `rajeshkamboj/cambuz-landing`.
  release:
    name: Publish GitHub Release assets
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.windows-x64.result == 'success' &&
      needs.linux-x64.result == 'success' &&
      needs.macos-arm64.result == 'success'
    needs: [windows-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate landing-site feature manifest
        run: node scripts/validate-landing-content.mjs

      - name: Determine release tag and mode
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          pkg_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ -z "$pkg_version" ]]; then
            echo "::error::Failed to read version from package.json"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tag="v${pkg_version}-build.${GITHUB_RUN_NUMBER}"
            is_auto_main="true"
            is_prerelease="true"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            is_auto_main="false"
            if [[ "$tag" == *-* ]]; then
              is_prerelease="true"
            else
              is_prerelease="false"
            fi
          else
            echo "::error::Unsupported ref for release publishing: ${GITHUB_REF}"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${pkg_version}" >> "$GITHUB_OUTPUT"
          echo "is_auto_main=${is_auto_main}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${tag} (auto_main=${is_auto_main}, prerelease=${is_prerelease})"

      # Each artifact goes to its own folder because each platform job writes a
      # per-platform SHA256SUMS.txt. All three downloads are required so a
      # partial release can never be published.
      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: cambuz-pdf-windows-x64
          path: release-src/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: cambuz-pdf-linux-x64
          path: release-src/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: cambuz-pdf-macos-arm64
          path: release-src/macos

      - name: Report optional code-signature status
        shell: bash
        run: |
          set -euo pipefail
          for platform in windows macos; do
            marker="release-src/$platform/SIGNED.txt"
            if [[ -f "$marker" ]] && [[ "$(cat "$marker")" == "signed" ]]; then
              echo "✓ ${platform} release assets are code-signed"
            else
              status="$(cat "$marker" 2>/dev/null || echo missing)"
              echo "::warning::${platform} release assets are unsigned (${status}); release publication will continue. Verify downloads with SHA256SUMS.txt."
            fi
          done

      - name: Verify all five installers and write combined SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf release-out
          mkdir -p release-out
          find release-src -type f \( \
            -name '*-win-x64-setup.exe' -o \
            -name '*-win-x64-portable.exe' -o \
            -name '*-linux-x86_64.AppImage' -o \
            -name '*-mac-arm64.dmg' -o \
            -name '*-mac-arm64.zip' \
          \) -exec cp {} release-out/ \;
          cd release-out
          ls -la

          required_patterns=(
            '*-win-x64-setup.exe'
            '*-win-x64-portable.exe'
            '*-linux-x86_64.AppImage'
            '*-mac-arm64.dmg'
            '*-mac-arm64.zip'
          )
          for pattern in "${required_patterns[@]}"; do
            matches=( $pattern )
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly 1 file matching '${pattern}', found ${#matches[@]}: ${matches[*]:-none}"
              exit 1
            fi
            if [[ ! -s "${matches[0]}" ]]; then
              echo "::error::Release asset '${matches[0]}' is empty"
              exit 1
            fi
          done

          binaries=( * )
          if [[ "${#binaries[@]}" -ne 5 ]]; then
            echo "::error::Expected exactly 5 release binaries before checksum generation, found ${#binaries[@]}: ${binaries[*]}"
            exit 1
          fi

          sha256sum "${binaries[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          line_count="$(wc -l < SHA256SUMS.txt | tr -d ' ')"
          if [[ "$line_count" -ne 5 ]]; then
            echo "::error::Expected 5 checksum lines in SHA256SUMS.txt, got ${line_count}"
            exit 1
          fi

      - name: Create or update the pinned GitHub Release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PKG_VERSION: ${{ steps.meta.outputs.version }}
          IS_AUTO_MAIN: ${{ steps.meta.outputs.is_auto_main }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          run_url="https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"

          if [[ "$IS_AUTO_MAIN" == "true" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          windows_signing="unsigned"
          macos_signing="unsigned"
          if [[ -f "release-src/windows/SIGNED.txt" ]] && [[ "$(cat release-src/windows/SIGNED.txt)" == "signed" ]]; then
            windows_signing="signed"
          fi
          if [[ -f "release-src/macos/SIGNED.txt" ]] && [[ "$(cat release-src/macos/SIGNED.txt)" == "signed" ]]; then
            macos_signing="signed"
          fi
          if [[ "$windows_signing" == "signed" && "$macos_signing" == "signed" ]]; then
            signing_note="Windows executables are Authenticode signed; the macOS app bundle is signed and notarized."
          else
            signing_note="Code-signing status: Windows ${windows_signing}; macOS ${macos_signing}. Unsigned Windows or macOS downloads may show SmartScreen or Gatekeeper warnings. Verify each download with \`SHA256SUMS.txt\`."
          fi
          {
            echo "Pre-release of **Cambuz PDF Reader ${PKG_VERSION}** (\`${TAG}\`) for Windows x64, Linux x64 *(experimental)* and macOS Apple Silicon *(experimental)*."
            echo ""
            echo "Built from commit \`${short_sha}\` (${GITHUB_SHA}) by [CI run ${GITHUB_RUN_ID}](${run_url}) — all five jobs green. ${signing_note}"
            echo ""
            echo "Verify after download: \`Get-FileHash -Algorithm SHA256 <file>\` (PowerShell) or \`sha256sum -c SHA256SUMS.txt\` (Linux/macOS)."
          } > "$notes_file"

          prerelease_flag=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-out/* --clobber
            gh release edit "$TAG" \
              --title "Cambuz PDF Reader $TAG" \
              --notes-file "$notes_file" \
              --prerelease="$IS_PRERELEASE" \
              --draft=false
          else
            gh release create "$TAG" release-out/* \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "Cambuz PDF Reader $TAG" \
              --notes-file "$notes_file" \
              $prerelease_flag
          fi

      - name: Synchronize README download links and commit to main
        if: steps.meta.outputs.is_auto_main == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

          signed_flag=""
          if [[ -f "release-src/windows/SIGNED.txt" ]] && [[ "$(cat release-src/windows/SIGNED.txt)" == "signed" ]] && \
             [[ -f "release-src/macos/SIGNED.txt" ]] && [[ "$(cat release-src/macos/SIGNED.txt)" == "signed" ]]; then
            signed_flag="--signed"
          fi

          node scripts/sync-release-readme.mjs \
            --tag "$TAG" \
            --repo "$GH_REPO" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            $signed_flag

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md; then
            echo "README.md is already synchronized with release $TAG."
          else
            git add README.md
            git commit -m "chore(release): sync README downloads for $TAG"
            git push origin HEAD:refs/heads/main
          fi

      - name: Notify cambuz-landing
        if: steps.meta.outputs.is_auto_main == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          CAMBUZ_LANDING_DISPATCH_TOKEN: ${{ secrets.CAMBUZ_LANDING_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CAMBUZ_LANDING_DISPATCH_TOKEN:-}" ]]; then
            echo "::warning::CAMBUZ_LANDING_DISPATCH_TOKEN is not set; skipping repository_dispatch to rajeshkamboj/cambuz-landing. The landing site's hourly repair sync will pick up release $TAG."
            exit 0
          fi

          payload="$(node -e 'console.log(JSON.stringify({
            event_type: "cambuz-release-published",
            client_payload: {
              tag: process.env.TAG,
              source_sha: process.env.SOURCE_SHA,
            },
          }))')"

          status_code="$(curl -sS -o "$RUNNER_TEMP/dispatch-response.txt" -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${CAMBUZ_LANDING_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/rajeshkamboj/cambuz-landing/dispatches \
            -d "$payload")"

          if [[ "$status_code" != "204" ]]; then
            echo "::error::Failed to dispatch cambuz-release-published to rajeshkamboj/cambuz-landing (HTTP ${status_code}): $(cat "$RUNNER_TEMP/dispatch-response.txt")"
            exit 1
          fi
          echo "Dispatched cambuz-release-published (tag=${TAG}, source_sha=${SOURCE_SHA}) to rajeshkamboj/cambuz-landing."
